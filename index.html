
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>System Alert</title>
<style>
  :root{
    --bg:#000;
    --green:#7fffd4;
    --red:#ff4b4b;
    --muted:#93f5d5;
  }
  html,body{height:100%;margin:0;background:var(--bg);font-family: "Courier New", monospace;color:var(--muted)}
  /* prevent underlying scroll while overlay is active */
  body.prank-active{overflow:hidden}

  /* Overlay */
  .overlay{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,0,0,0.06), transparent 10%),
      linear-gradient(180deg, rgba(0,0,0,0.92), rgba(3,6,12,0.98));
    z-index:999999; padding:24px; box-sizing:border-box;
  }

  /* Terminal window */
  .term {
    width:min(1080px,96%); max-height:88vh; border-radius:10px;
    background:linear-gradient(180deg, rgba(1,4,9,0.98), rgba(0,0,0,0.95));
    border:1px solid rgba(255,0,0,0.06); padding:18px; box-shadow:0 30px 90px rgba(0,0,0,0.85);
    overflow:auto; position:relative;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  .header { display:flex; gap:12px; align-items:center; margin-bottom:10px }
  .dot { width:11px;height:11px;border-radius:50%; background:var(--red); box-shadow:0 0 8px var(--red) }
  .h-title { color:#ff9b9b; font-weight:800; letter-spacing:1px }

  .screen {
    background: rgba(0,0,0,0.36); padding:14px; border-radius:6px; color:#c6ffd9;
    font-size:14px; line-height:1.45; white-space:pre-wrap; min-height:260px; font-family: "Courier New", monospace;
    position:relative; overflow:hidden;
  }

  .big {
    margin-top:14px; color:var(--red); font-weight:900; font-size:clamp(24px,5vw,48px);
    text-transform:uppercase; letter-spacing:1px; text-align:center;
  }

  .typed { color:#bfffd1; font-size:13px; margin-top:8px; min-height:72px; }

  /* controls */
  .controls { display:flex; gap:12px; justify-content:center; margin-top:16px; flex-wrap:wrap }
  .btn {
    padding:10px 14px; border-radius:8px; border:none; cursor:pointer;
    font-weight:800; letter-spacing:0.6px; background:rgba(255,255,255,0.06); color:#fff;
  }
  .btn:active{transform:translateY(1px)}
  .reveal { background: linear-gradient(90deg,#ff6b6b,#ff2f2f); box-shadow:0 10px 30px rgba(255,31,31,0.12) }
  .close { background: linear-gradient(90deg,#1f2937,#0f172a); }

  /* flashing bar */
  .flash {
    position:absolute; left:0; top:0; right:0; height:6px; background:linear-gradient(90deg,#ff1f1f,#ff9b9b);
    animation: flashy 1.2s linear infinite; opacity:0.9;
  }
  @keyframes flashy { 0%{transform:translateX(-100%)} 50%{transform:translateX(0)} 100%{transform:translateX(100%)} }

  /* scanlines */
  .scanline{
    pointer-events:none; position:absolute; inset:0; mix-blend-mode:overlay; opacity:0.06;
    background-image: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.02) 0px,
      rgba(255,255,255,0.02) 1px,
      transparent 1px,
      transparent 6px
    );
  }

  /* bottom-right prank label required by you */
  .bottom-prank {
    position:fixed; right:12px; bottom:10px; z-index:1000001;
    background:rgba(255,215,50,0.95); color:#0a0a0a; padding:8px 10px; border-radius:6px; font-weight:800;
    box-shadow:0 10px 30px rgba(0,0,0,0.45); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial;
    user-select:none;
  }

  /* typing cursor */
  .cursor { display:inline-block; width:10px; height:18px; background:var(--green); margin-left:6px; vertical-align:middle; animation: blink 1s steps(2,start) infinite }
  @keyframes blink { to { visibility:hidden } }

  /* small footer note inside terminal (optional) */
  .foot { margin-top:12px; color:#ffdfdf; font-weight:700; font-size:12px; text-align:center; opacity:0.9; }


  #breachPopup {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999999;
}

.popupBox {
  background: black;
  padding: 30px 60px;
  border: 2px solid #ff4b4b;
  font-size: 38px;
  color: #ff4b4b;
  font-weight: 900;
  text-shadow: 0 0 12px red;
  animation: flicker 0.15s infinite;
  border-radius: 10px;
}

#finalAlert {
  position: fixed;
  inset: 0;
  background: #1a0000;
  color: red;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 42px;
  text-shadow: 0 0 15px red;
  z-index: 99999999;
}

.alertText {
  animation: pulse 1s infinite;
}

@keyframes flicker {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.7; }
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.06); }
  100% { transform: scale(1); }
}

</style>

  const typedArea = document.getElementById('typedArea');

  async function typeLines(lines) {
    for (const line of lines) {
      await typeLine(line);
      await wait(250);
    }
  }

  function typeLine(text) {
    return new Promise(resolve => {
      const lineDiv = document.createElement("div");   // ← each line gets its own element
      typedArea.appendChild(lineDiv);

      let i = 0;
      const t = setInterval(() => {
        lineDiv.textContent += text.charAt(i);
        i++;
        if (i >= text.length) {
          clearInterval(t);
          resolve();
        }
      }, 20 + Math.random()*25);
    });
  }

  function wait(ms) {
    return new Promise(r => setTimeout(r, ms));
  }

  // typeLines(lines);
  typeLines(lines).then(showBreachPopup);

  function showBreachPopup() {
  const popup = document.getElementById("breachPopup");
  popup.style.display = "flex";

  // popup stays for 2 seconds
  setTimeout(() => {
    popup.style.display = "none";
    showFinalAlert();
  }, 2000);
}

function showFinalAlert() {
  const alert = document.getElementById("finalAlert");
  alert.style.display = "flex";

  // stays for 2.5 sec then closes everything
  setTimeout(() => {
    alert.style.display = "none";
    document.getElementById("overlay").remove();
    document.body.classList.remove("prank-active");
  }, 2500);
}


</script>
